<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ĐĂNG NHẬP // MINI EDR SOC OPERATOR GATEWAY</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; background-color: var(--bg-main);">
  <div class="cyber-card" style="width: 100%; max-width: 440px; padding: 2.5rem; border: 1px solid var(--border-color); background-color: var(--bg-card); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); margin-bottom: 0;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: linear-gradient(135deg, var(--cyan) 0%, #0284C7 100%); border-radius: var(--radius-sm); margin-bottom: 1rem; box-shadow: 0 0 16px var(--cyan-glow);">
        <span style="font-size: 22px;">🛡️</span>
      </div>
      <h1 style="font-size: 1.45rem; font-weight: 700; color: #fff; margin-bottom: 0.35rem; letter-spacing: 0.05em;">MINI-<span>EDR</span></h1>
      <div style="font-size: 0.72rem; letter-spacing: 0.1em; color: var(--cyan); text-transform: uppercase; font-family: var(--font-mono); font-weight: 600;">
        CỔNG ĐIỀU HÀNH AN NINH SOC
      </div>
    </div>

    {% if error %}
      <div class="cyber-toast error" style="margin-bottom: 1.5rem; animation: none;">
        {{ error }}
      </div>
    {% endif %}

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div style="margin-bottom: 1.5rem;">
          {% for category, msg in messages %}
            <div class="cyber-toast {{ category }}" style="margin-bottom: 0.5rem; animation: none;">
              {{ msg }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('web.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_url or '' }}">
      <div style="margin-bottom: 1.5rem;">
        <label for="token" style="display: block; font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 0.5rem;">
          MÃ KHÓA XÁC THỰC CHUYÊN VIÊN (EDR_API_TOKEN):
        </label>
        <input 
          type="password" 
          id="token" 
          name="token" 
          required 
          autocomplete="current-password"
          placeholder="Nhập mã token bảo mật..." 
          class="cyber-input"
          style="width: 100%; font-size: 0.9rem;"
        >
      </div>

      <button type="submit" class="btn btn-cyan" style="width: 100%; padding: 0.75rem; font-weight: 700; font-size: 0.88rem; letter-spacing: 0.05em;">
        AUTHENTICATE SESSION // ĐĂNG NHẬP
      </button>
    </form>

    <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.72rem; color: var(--text-dim);">
      <span>MÔI TRƯỜNG PHÒNG THÍ NGHIỆM AN NINH MẠNG LINUX</span>
    </div>
  </div>
</body>
</html>
